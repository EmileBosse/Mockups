<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0C0D0F; font-family: 'Public Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #F2C14E; text-decoration: none; } a:hover { color: #FFD37A; }
  select { font-family: 'Public Sans', sans-serif; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; background: #0C0D0F; color: #EDEFF2; display: flex; flex-direction: column;">

  <div style="flex-grow: 1; padding: 26px 20px 0 20px; overflow: hidden;">
    <div style="font-family: 'Sora', sans-serif; font-size: 27px; font-weight: 600; color: #3C4147;">Aujourd&#39;hui</div>
    <div style="font-size: 13px; color: #31363B; margin-top: 4px;">Mercredi 17 septembre</div>
    <div style="margin-top: 22px; height: 96px; border-radius: 14px; border: 1px solid #1A1D21;"></div>
    <div style="margin-top: 14px; height: 40px; border-radius: 10px; border: 1px solid #1A1D21;"></div>
  </div>

  <div style="flex-shrink: 0; background: #1D2024; border-top: 1px solid #2A2E34; border-radius: 22px 22px 0 0; padding: 12px 20px 24px 20px;">

    <div style="display: flex; justify-content: center; padding-bottom: 14px;">
      <div style="width: 44px; height: 4px; border-radius: 2px; background: #3A4048;"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <div style="flex-grow: 1; font-family: 'Sora', sans-serif; font-size: 20px; font-weight: 600;">Nouveau voyage</div>
      <a href="C-Bluehat-Aujourdhui.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #2A2E34; display: flex; align-items: center; justify-content: center; color: #9AA1AA;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="margin-top: 18px; display: flex; align-items: center; gap: 12px; background: #23262B; border-radius: 10px; padding: 13px 14px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#E9A82C" stroke-width="1.9" stroke-linecap="round"><path d="M9 4.5h6v3H9z"></path><path d="M7.5 6H6A1.5 1.5 0 0 0 4.5 7.5V19A1.5 1.5 0 0 0 6 20.5h12A1.5 1.5 0 0 0 19.5 19V7.5A1.5 1.5 0 0 0 18 6h-1.5"></path></svg>
      <div style="flex-grow: 1;">
        <div style="font-size: 14.5px; font-weight: 600;">Tremblay &mdash; entr&eacute;e de cour</div>
        <div style="font-size: 12px; color: #9AA1AA; margin-top: 2px;">Chantier s&eacute;lectionn&eacute;</div>
      </div>
      <span style="font-size: 12.5px; color: #F2C14E; font-weight: 600;">Changer</span>
    </div>

    <div style="margin-top: 20px;">
      <div style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; color: #78808A;">SORTE DE VOYAGE</div>
      <div style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px;">
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #3A4048; background: none; color: #EDEFF2; font: inherit; font-size: 14px; cursor: pointer;">Sable</button>
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #3A4048; background: none; color: #EDEFF2; font: inherit; font-size: 14px; cursor: pointer;">Terre</button>
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #E9A82C; background: #2A2209; color: #F2C14E; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;">Gravier 0-3/4</button>
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #3A4048; background: none; color: #EDEFF2; font: inherit; font-size: 14px; cursor: pointer;">Pierre nette</button>
        <button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #3A4048; background: none; color: #EDEFF2; font: inherit; font-size: 14px; cursor: pointer;">MG-20</button>
      </div>
    </div>

    <div style="margin-top: 20px; display: flex; gap: 12px;">
      <div style="flex-grow: 1;">
        <div style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; color: #78808A;">NOMBRE</div>
        <div style="margin-top: 10px; display: flex; align-items: center; gap: 10px;">
          <button type="button" aria-label="Retirer un voyage" style="width: 52px; height: 52px; border-radius: 26px; border: 1px solid #3A4048; background: none; color: #EDEFF2; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg>
          </button>
          <div style="flex-grow: 1; height: 52px; border-radius: 10px; background: #23262B; display: flex; align-items: center; justify-content: center; font-family: 'Sora', sans-serif; font-size: 22px; font-weight: 600;">3</div>
          <button type="button" aria-label="Ajouter un voyage" style="width: 52px; height: 52px; border-radius: 26px; border: 1px solid #3A4048; background: none; color: #EDEFF2; cursor: pointer; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <div style="margin-top: 20px;">
      <label for="pit" style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.14em; color: #78808A;">PIC / FOURNISSEUR</label>
      <select id="pit" style="margin-top: 10px; width: 100%; height: 52px; border-radius: 10px; border: 1px solid #3A4048; background: #23262B; color: #EDEFF2; font-size: 14.5px; padding: 0 12px;">
        <option>Pic Boucher</option>
        <option>Carri&egrave;re Saint-Prime</option>
        <option>Autre &mdash; pr&eacute;ciser</option>
      </select>
    </div>

    <div style="margin-top: 18px; display: flex; align-items: center; gap: 12px; padding: 4px 0;">
      <div style="flex-grow: 1;">
        <div style="font-size: 14.5px; font-weight: 600;">Dividende requis</div>
        <div style="font-size: 12px; color: #9AA1AA; margin-top: 2px;">&Agrave; facturer au client</div>
      </div>
      <div style="width: 52px; height: 30px; border-radius: 15px; background: #E9A82C; display: flex; align-items: center; justify-content: flex-end; padding: 3px;">
        <div style="width: 24px; height: 24px; border-radius: 12px; background: #14100A;"></div>
      </div>
    </div>

    <button type="button" style="margin-top: 20px; width: 100%; height: 58px; border-radius: 12px; border: none; background: #E9A82C; color: #14100A; font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 600; cursor: pointer;">Enregistrer le voyage</button>

  </div>

</div>
</body>
</html>

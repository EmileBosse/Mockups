<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Karla:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0B0B0C; font-family: 'Karla', sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: #F2C14E; text-decoration: none; } a:hover { color: #FFD37A; }
  input, select { font-family: 'Karla', sans-serif; }
  input::placeholder { color: #7C7C7C; }
  @keyframes sheet-in { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes sheet-out { from { transform: translateY(0); } to { transform: translateY(100%); } }
  .a-sheet { animation: sheet-in .34s cubic-bezier(.22,.9,.32,1) both; }
  .a-sheet.a-sheet-closing { animation: sheet-out .26s cubic-bezier(.4,0,1,1) both; }
  .combo { position: relative; }
  .combo-field { display: flex; align-items: center; gap: 10px; border: 1px solid #4A3D22; background: #14110A; border-radius: 8px; padding: 0 12px; height: 48px; cursor: text; }
  .combo-field:focus-within { border-color: #E9A82C; }
  .combo-input { flex-grow: 1; height: 46px; background: none; border: none; color: #F4F2EE; font-size: 15px; outline: none; font-family: 'Karla', sans-serif; }
  .combo-input::placeholder { color: #7C7C7C; }
  .combo-chevron { flex-shrink: 0; color: #8E8E8E; transition: transform .15s ease; }
  .combo.open .combo-chevron { transform: rotate(180deg); }
  .combo-panel { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; max-height: 208px; overflow-y: auto; background: #151310; border: 1px solid #2A2823; border-radius: 8px; padding: 6px; box-shadow: 0 12px 28px rgba(0,0,0,.5); }
  .combo-option { display: block; width: 100%; text-align: left; padding: 11px 12px; border-radius: 6px; border: none; background: none; color: #D6D3CD; font: inherit; font-size: 14.5px; cursor: pointer; }
  .combo-option[hidden] { display: none; }
  .combo-option:hover { background: #1A1408; color: #F2C14E; }
  .combo-option[aria-selected="true"] { background: #1A1408; color: #F2C14E; font-weight: 700; }
  .combo-empty { padding: 11px 12px; color: #8E8E8E; font-size: 13.5px; }
</style>
</head>
<body>
<div style="width: 390px; height: 844px; background: #0B0B0C; color: #F4F2EE; display: flex; flex-direction: column; overflow: hidden;">

  <div style="flex-shrink: 0;">
    <div style="padding: 24px 20px 0 20px; display: flex; align-items: flex-start; justify-content: space-between;">
      <div>
        <div style="font-family: 'Oswald', sans-serif; font-size: 20px; font-weight: 500; letter-spacing: 0.02em;">Bonjour, Marc</div>
        <div style="font-size: 13px; color: #A7A7A7; margin-top: 2px;">Mercredi 17 septembre</div>
      </div>
      <div style="border: 1px solid #3C5A86; color: #9CC1F5; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; padding: 6px 10px; border-radius: 4px;">BLUEHAT</div>
    </div>

    <div style="padding: 24px 20px 0 20px; display: flex; justify-content: center;">
      <img src="assets/logo_transparent.png" alt="Excavation J2B" style="display: block; width: 250px; height: 140px; object-fit: contain;">
    </div>
  </div>

  <div class="a-sheet" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #141310; border-top: 1px solid #2A2823; border-radius: 22px 22px 0 0; box-shadow: 0 -12px 32px rgba(0,0,0,.45); overflow: hidden;">

    <div style="flex-shrink: 0; display: flex; justify-content: center; padding: 10px 0 4px 0;">
      <div style="width: 40px; height: 4px; border-radius: 2px; background: #3A3226;"></div>
    </div>

    <div style="flex-shrink: 0; padding: 6px 16px 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #1C1A16;">
      <div style="flex-grow: 1; font-family: 'Oswald', sans-serif; font-size: 19px; font-weight: 500; letter-spacing: 0.03em;">AJOUTER DU MAT&Eacute;RIEL</div>
      <div style="font-size: 12px; color: #A7A7A7;">17 sept.</div>
      <a href="Main.html" aria-label="Fermer" class="a-sheet-close" style="flex-shrink: 0; width: 40px; height: 40px; border-radius: 20px; border: 1px solid #2A2823; display: flex; align-items: center; justify-content: center; color: #F4F2EE;">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="flex-grow: 1; min-height: 0; padding: 16px 16px 0 16px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto;">

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="mjob" style="font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.16em; color: #8E8E8E;">CHANTIER</label>
        <div style="display: flex; align-items: center; gap: 10px; border: 1px solid #23211C; background: #100F0D; border-radius: 8px; padding: 0 12px; height: 48px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8E8E8E" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M15.5 15.5 20 20"></path></svg>
          <input id="mjob" type="text" placeholder="Nom, client ou date..." style="flex-grow: 1; height: 46px; background: none; border: none; color: #F4F2EE; font-size: 15px; outline: none;">
        </div>
        <div style="border: 1px solid #4A3D22; background: #14110A; border-radius: 8px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#F2C14E" stroke-width="2" stroke-linecap="round"><path d="M5 13l4.5 4.5L19 7"></path></svg>
          <div style="flex-grow: 1;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="font-size: 15px; font-weight: 700;">Tremblay &mdash; entr&eacute;e de cour</div>
              <span style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 10px; background: #132016; border: 1px solid #2E4A34; color: #8FCB9B; font-size: 10px; font-weight: 700; letter-spacing: 0.08em;"><span style="width: 5px; height: 5px; border-radius: 3px; background: #7FA88A;"></span>ACTIF</span>
            </div>
            <div style="font-size: 12px; color: #A7A7A7; margin-top: 2px;">Rang 4, Saint-Prime</div>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <label for="mtype" style="font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.16em; color: #8E8E8E;">MAT&Eacute;RIEL</label>
        <div class="combo" data-combo>
          <div class="combo-field">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#8E8E8E" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6"></circle><path d="M15.5 15.5 20 20"></path></svg>
            <input id="mtype" class="combo-input" type="text" placeholder="Rechercher un mat&eacute;riel..." autocomplete="off" value="Tuyau BNQ 6 po">
            <svg class="combo-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
          </div>
          <div class="combo-panel" hidden>
            <button type="button" class="combo-option">Membrane g&eacute;otextile</button>
            <button type="button" class="combo-option" aria-selected="true">Tuyau BNQ 6 po</button>
            <button type="button" class="combo-option">Puisard</button>
            <button type="button" class="combo-option">B&eacute;ton</button>
            <button type="button" class="combo-option">Tourbe</button>
            <button type="button" class="combo-option">Isolant rigide</button>
            <button type="button" class="combo-option">Grillage &agrave; poule</button>
            <button type="button" class="combo-option">Fil &agrave; cl&ocirc;ture</button>
            <button type="button" class="combo-option">Bardeaux</button>
            <button type="button" class="combo-option">Coffrage</button>
            <button type="button" class="combo-option">Autre &mdash; pr&eacute;ciser</button>
            <div class="combo-empty" hidden>Aucun r&eacute;sultat</div>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px;">
          <div style="font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.16em; color: #8E8E8E;">QUANTIT&Eacute;</div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <button type="button" aria-label="Diminuer la quantit&eacute;" style="width: 52px; height: 56px; border-radius: 8px; border: 1px solid #2A2823; background: #100F0D; color: #F4F2EE; cursor: pointer; display: flex; align-items: center; justify-content: center;">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg>
            </button>
            <div style="flex-grow: 1; height: 56px; border: 1px solid #4A3D22; background: #100F0D; border-radius: 8px; display: flex; align-items: center; justify-content: center;">
              <span style="font-family: 'Oswald', sans-serif; font-size: 28px; color: #F4F2EE;">12</span>
            </div>
            <button type="button" aria-label="Augmenter la quantit&eacute;" style="width: 52px; height: 56px; border-radius: 8px; border: 1px solid #2A2823; background: #100F0D; color: #F4F2EE; cursor: pointer; display: flex; align-items: center; justify-content: center;">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
        </div>
        <div style="width: 116px; display: flex; flex-direction: column; gap: 10px;">
          <label for="munit" style="font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.16em; color: #8E8E8E;">UNIT&Eacute;</label>
          <select id="munit" style="height: 56px; border: 1px solid #23211C; background: #100F0D; border-radius: 8px; padding: 0 10px; color: #F4F2EE; font-size: 15px;">
            <option>m&egrave;tre</option>
            <option>unit&eacute;</option>
            <option>tonne</option>
            <option>sac</option>
            <option>rouleau</option>
          </select>
        </div>
      </div>

      <div style="display: flex; flex-direction: column;">
        <label for="mfour" style="font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.16em; color: #8E8E8E;">FOURNISSEUR (OPTIONNEL)</label>
        <select id="mfour" style="margin-top: 10px; width: 100%; height: 48px; border: 1px solid #23211C; background: #100F0D; border-radius: 8px; padding: 0 12px; color: #F4F2EE; font-size: 15px;">
          <option>BMR Saint-F&eacute;licien</option>
          <option>Ciment Qu&eacute;bec</option>
          <option>Autre &mdash; pr&eacute;ciser</option>
        </select>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="mnote" style="font-family: 'Oswald', sans-serif; font-size: 11.5px; letter-spacing: 0.16em; color: #8E8E8E;">NOTE (OPTIONNEL)</label>
        <input id="mnote" type="text" placeholder="Ex. fourni par le client" style="height: 48px; border: 1px solid #23211C; background: #100F0D; border-radius: 8px; padding: 0 12px; color: #F4F2EE; font-size: 15px; outline: none;">
      </div>

    </div>

    <div style="flex-shrink: 0; padding: 16px; border-top: 1px solid #1C1A16; display: flex; flex-direction: column; gap: 10px;">
      <button type="button" style="width: 100%; height: 56px; border-radius: 8px; border: none; background: #E9A82C; color: #14100A; font-family: 'Oswald', sans-serif; font-size: 17px; letter-spacing: 0.1em; cursor: pointer;">AJOUTER</button>
      <div style="text-align: center; font-size: 12px; color: #8E8E8E;">Gard&eacute; sur l&#39;appareil &mdash; synchronisez depuis l&#39;accueil</div>
    </div>

  </div>

</div>
<script>
(function () {
  var closeBtn = document.querySelector('.a-sheet-close');
  var sheet = document.querySelector('.a-sheet');
  if (closeBtn && sheet) {
    closeBtn.addEventListener('click', function (e) {
      e.preventDefault();
      var href = closeBtn.getAttribute('href');
      sheet.classList.add('a-sheet-closing');
      setTimeout(function () { window.location.href = href; }, 220);
    });
  }
  document.querySelectorAll('[data-combo]').forEach(function (combo) {
    var field = combo.querySelector('.combo-field');
    var input = combo.querySelector('.combo-input');
    var panel = combo.querySelector('.combo-panel');
    var empty = combo.querySelector('.combo-empty');
    var options = Array.prototype.slice.call(combo.querySelectorAll('.combo-option'));

    function open() { combo.classList.add('open'); panel.hidden = false; }
    function close() { combo.classList.remove('open'); panel.hidden = true; }
    function filter() {
      var q = input.value.trim().toLowerCase();
      var visible = 0;
      options.forEach(function (opt) {
        var match = opt.textContent.toLowerCase().indexOf(q) !== -1;
        opt.hidden = !match;
        if (match) visible++;
      });
      empty.hidden = visible !== 0;
    }
    function select(opt) {
      input.value = opt.textContent;
      options.forEach(function (o) { o.removeAttribute('aria-selected'); });
      opt.setAttribute('aria-selected', 'true');
      close();
    }

    field.addEventListener('click', function () { open(); input.focus(); input.select(); });
    input.addEventListener('input', function () { open(); filter(); });
    input.addEventListener('focus', open);
    options.forEach(function (opt) {
      opt.addEventListener('click', function () { select(opt); });
    });
    document.addEventListener('click', function (e) {
      if (!combo.contains(e.target)) close();
    });
  });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plans">
<meta name="theme-color" content="#ffffff">
<title>Plans — Dessin</title>
<style>
:root{
  --ink:#1c2230; --muted:#667085; --line:#e4e7ec; --chrome:#ffffff; --soft:#f2f4f7;
  --accent:#2563eb; --danger:#d92d20;
  --shadow:0 4px 14px rgba(16,24,40,.14),0 1px 3px rgba(16,24,40,.08);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  --tb-h:72px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
#board{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* Boutons ronds flottants */
.fab{width:52px;height:52px;border-radius:50%;background:var(--chrome);border:1px solid var(--line);
  box-shadow:var(--shadow);display:grid;place-items:center;padding:0}
.fab svg{width:24px;height:24px}
.fab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
#btnMenu{position:fixed;top:calc(var(--safe-t) + 12px);left:calc(var(--safe-l) + 14px)}
.top-right{position:fixed;top:calc(var(--safe-t) + 12px);right:calc(var(--safe-r) + 14px);display:flex;gap:10px;align-items:center}
.pill{display:flex;background:var(--chrome);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);height:52px;padding:0 2px}
.pill button{width:48px;height:50px;border:0;background:none;display:grid;place-items:center;padding:0}
.pill button svg{width:22px;height:22px}
.pill button:disabled{opacity:.3;cursor:default}

/* Indicateur de zoom */
#zoomPill{position:fixed;top:calc(var(--safe-t) + 76px);left:50%;transform:translateX(-50%);
  background:rgba(28,34,48,.86);color:#fff;border:0;border-radius:18px;height:36px;padding:0 14px;font-size:14px;font-weight:600}

/* Barre d'outils */
.toolbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 16px);
  display:flex;gap:4px;padding:6px;background:var(--chrome);border:1px solid var(--line);border-radius:40px;box-shadow:var(--shadow)}
.tool{width:60px;height:60px;border-radius:50%;border:0;background:transparent;padding:0;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;letter-spacing:.1px}
.tool svg{width:24px;height:24px}
.tool[aria-pressed="true"]{background:var(--accent);color:#fff}
.tool .more{position:absolute;right:10px;bottom:10px;width:0;height:0;border-left:6px solid transparent;border-bottom:6px solid currentColor;opacity:.55}
.swatch-ico{width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--line)}
@media (max-width:360px){.tool{width:54px;height:54px;font-size:10px}}

/* Popovers au-dessus de la barre */
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 16px + var(--tb-h) + 12px);
  background:var(--chrome);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:12px;
  animation:pop-in .14s ease-out}
@keyframes pop-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.pop h3{margin:2px 6px 10px;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.shape-grid{display:grid;grid-template-columns:repeat(5,60px);gap:6px}
@media (max-width:360px){.shape-grid{grid-template-columns:repeat(5,54px)}}
.shape-grid button{height:64px;padding:0;border:0;border-radius:16px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600}
.shape-grid button svg{width:26px;height:26px}
.shape-grid button[aria-pressed="true"]{background:var(--accent);color:#fff}
.colors{display:grid;grid-template-columns:repeat(5,44px);gap:8px;padding:0 4px}
.colors button{width:44px;height:44px;border-radius:50%;border:0;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.widths{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.widths button{height:52px;border:0;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11.5px;font-weight:600}
.widths button i{display:block;width:34px;border-radius:9px;background:currentColor}
.widths button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sep{height:1px;background:var(--line);margin:12px 2px}

/* Menu (chevron en haut à gauche) */
.menu{position:fixed;top:calc(var(--safe-t) + 12px);left:calc(var(--safe-l) + 14px);width:min(300px,calc(100vw - 28px));
  background:var(--chrome);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden;z-index:5;
  transform-origin:top left;animation:menu-in .16s ease-out}
@keyframes menu-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.menu-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:16px 16px 2px;text-align:left}
.menu-head b{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-head svg{width:18px;height:18px;color:var(--muted)}
.menu-status{padding:0 16px 12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.menu-status::before{content:"";width:7px;height:7px;border-radius:50%;background:#12b76a}
.menu-status.warn::before{background:#f79009}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;border:0;border-top:1px solid var(--line);background:none;padding:0 18px;font-size:16.5px;font-weight:500;text-align:left}
.menu-item svg{width:22px;height:22px;color:var(--muted)}
.menu-item:active{background:var(--soft)}
.menu-foot{border-top:1px solid var(--line);padding:6px 8px}
.menu-foot button{width:48px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center}
.menu-foot svg{width:26px;height:26px}

/* Sélection (outil Déplacer) */
#selBar{position:fixed;display:flex;gap:6px;transform:translateX(-50%)}
#selBar button{height:44px;border:0;border-radius:22px;padding:0 16px 0 12px;display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;background:var(--ink);color:#fff;box-shadow:var(--shadow)}
#selBar button.danger{background:var(--danger)}
#selBar svg{width:18px;height:18px}

/* Feuilles du bas (Mes dessins, Exporter) */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.38);animation:fade .18s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--chrome);
  border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(16,24,40,.18);padding-bottom:var(--safe-b);animation:sheet-in .24s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet-in{from{transform:translateY(100%)}}
.sheet-grab{width:40px;height:5px;border-radius:3px;background:#d0d5dd;margin:8px auto 0}
.sheet-head{display:flex;align-items:center;padding:8px 10px 8px 20px}
.sheet-head h2{flex:1;margin:0;font-size:20px}
.sheet-head button{width:44px;height:44px;border:0;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.sheet-head svg{width:20px;height:20px}
.sheet-body{overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding:4px 16px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.card.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card-open{display:block;width:100%;border:0;background:none;padding:0;text-align:left}
.card-open img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--soft);border-bottom:1px solid var(--line)}
.card-name{display:block;padding:9px 48px 0 11px;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-date{display:block;padding:2px 48px 10px 11px;font-size:12px;color:var(--muted)}
.card-del{position:absolute;right:2px;bottom:2px;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;color:var(--muted)}
.card-del svg{width:19px;height:19px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px 16px;margin-bottom:10px;text-align:left}
.opt>svg{width:28px;height:28px;flex:none;color:var(--accent)}
.opt b{display:block;font-size:16.5px}
.opt span{display:block;font-size:13px;color:var(--muted);margin-top:2px}

/* Dialogue texte / renommer */
.dlg-wrap{position:fixed;inset:0;background:rgba(16,24,40,.38);display:flex;justify-content:center;align-items:flex-start;padding:calc(var(--safe-t) + 70px) 16px 0}
.dlg{width:min(420px,100%);background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:16px}
.dlg label{display:block;font-weight:600;font-size:16px;margin:2px 2px 10px}
.dlg textarea{width:100%;font:inherit;font-size:18px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;outline:none;-webkit-user-select:text;user-select:text}
.dlg textarea:focus{border-color:var(--accent)}
.dlg-actions{display:flex;gap:10px;margin-top:12px}
.dlg-actions button{flex:1;height:48px;border-radius:14px;border:0;background:var(--soft);font-size:16px;font-weight:600}
.dlg-actions .primary{background:var(--accent);color:#fff}

/* Message d'accueil et toast */
#hint{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;color:#98a2b3;pointer-events:none;width:260px}
#hint svg{width:44px;height:44px;margin-bottom:8px}
#hint b{display:block;color:#667085;font-size:17px;margin-bottom:4px}
#hint span{font-size:14.5px;line-height:1.4}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 16px + var(--tb-h) + 14px);
  max-width:calc(100vw - 32px);background:var(--ink);color:#fff;border-radius:14px;padding:11px 16px;font-size:14.5px;line-height:1.35;text-align:center;box-shadow:var(--shadow);pointer-events:none;animation:fade .18s}
</style>
</head>
<body>

<canvas id="board" aria-label="Zone de dessin"></canvas>

<div id="hint" hidden>
  <span data-icon="pen"></span>
  <b>Nouveau dessin</b>
  <span>Dessinez avec le doigt.<br>Deux doigts pour zoomer ou vous déplacer.</span>
</div>

<!-- Haut gauche : menu -->
<button class="fab" id="btnMenu" aria-label="Ouvrir le menu" aria-expanded="false" data-icon="chevDown"></button>

<div class="menu" id="menu" hidden role="menu">
  <button class="menu-head" id="btnRename" aria-label="Renommer le dessin"><b id="docName">Plan</b><span data-icon="pen"></span></button>
  <div class="menu-status" id="saveStatus">Enregistré automatiquement</div>
  <button class="menu-item" data-act="new" data-icon="fileNew">Nouveau dessin</button>
  <button class="menu-item" data-act="list" data-icon="folder">Mes dessins</button>
  <button class="menu-item" data-act="import" data-icon="download">Importer un dessin</button>
  <button class="menu-item" data-act="export" data-icon="share">Exporter le dessin</button>
  <div class="menu-foot"><button id="btnMenuClose" aria-label="Fermer le menu" data-icon="chevUp"></button></div>
</div>

<!-- Haut droite : annuler / rétablir / quadrillage -->
<div class="top-right">
  <div class="pill">
    <button id="btnUndo" aria-label="Annuler" data-icon="undo"></button>
    <button id="btnRedo" aria-label="Rétablir" data-icon="redo"></button>
  </div>
  <button class="fab" id="btnGrid" aria-label="Quadrillage" aria-pressed="false" data-icon="grid"></button>
</div>

<button id="zoomPill" hidden aria-label="Recentrer le dessin">100 %</button>

<!-- Barre d'outils -->
<nav class="toolbar" aria-label="Outils">
  <button class="tool" data-tool="pen" aria-pressed="true"><span data-icon="pen"></span>Crayon</button>
  <button class="tool" data-tool="shape" id="toolShape" aria-pressed="false" aria-label="Ligne et formes (maintenir pour choisir)"><span id="shapeIco"></span><span id="shapeLbl">Ligne</span><i class="more"></i></button>
  <button class="tool" data-tool="text" aria-pressed="false"><span data-icon="text"></span>Texte</button>
  <button class="tool" data-tool="move" aria-pressed="false"><span data-icon="move"></span>Déplacer</button>
  <button class="tool" id="toolColor" aria-label="Couleur et épaisseur"><span class="swatch-ico" id="colorIco"></span>Couleur</button>
</nav>

<div class="pop" id="popShapes" hidden>
  <h3>Formes</h3>
  <div class="shape-grid" id="shapeGrid"></div>
</div>

<div class="pop" id="popColors" hidden>
  <h3>Couleur</h3>
  <div class="colors" id="colorGrid"></div>
  <div class="sep"></div>
  <h3>Épaisseur</h3>
  <div class="widths" id="widthGrid"></div>
</div>

<div id="selBar" hidden>
  <button id="btnDup" data-icon="copy">Dupliquer</button>
  <button id="btnDel" class="danger" data-icon="trash">Supprimer</button>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="sheetList" hidden aria-label="Mes dessins">
  <div class="sheet-grab"></div>
  <div class="sheet-head"><h2>Mes dessins</h2><button data-close aria-label="Fermer" data-icon="x"></button></div>
  <div class="sheet-body"><div class="cards" id="cards"></div></div>
</section>

<section class="sheet" id="sheetExport" hidden aria-label="Exporter le dessin">
  <div class="sheet-grab"></div>
  <div class="sheet-head"><h2>Exporter le dessin</h2><button data-close aria-label="Fermer" data-icon="x"></button></div>
  <div class="sheet-body">
    <button class="opt" id="expPng"><span data-icon="image"></span><div><b>Image (PNG)</b><span>Pour l’envoyer par texto, courriel ou l’imprimer</span></div></button>
    <button class="opt" id="expPlan"><span data-icon="file"></span><div><b>Fichier modifiable (.plan.json)</b><span>Pour le rouvrir plus tard avec « Importer un dessin »</span></div></button>
  </div>
</section>

<div class="dlg-wrap" id="dlg" hidden>
  <form class="dlg" id="dlgForm">
    <label for="dlgInput" id="dlgTitle">Ajouter du texte</label>
    <textarea id="dlgInput" rows="2" autocomplete="off" autocapitalize="sentences"></textarea>
    <div class="dlg-actions">
      <button type="button" id="dlgCancel">Annuler</button>
      <button type="submit" class="primary" id="dlgOk">Ajouter</button>
    </div>
  </form>
</div>

<input type="file" id="fileIn" accept="image/*,.json,application/json" hidden>
<div id="toast" hidden></div>

<script>
(() => {
/* ---------- Icônes ---------- */
const I = {
  chevDown:'<path d="M6 9l6 6 6-6"/>', chevUp:'<path d="M6 15l6-6 6 6"/>',
  grid:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16M4 12h16"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/>',
  redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 000 11H13"/>',
  pen:'<path d="M4 20l4.2-1L19 8.2 15.8 5 5 15.8 4 20z"/><path d="M13.5 7.3l3.2 3.2"/>',
  line:'<path d="M5 19L19 5"/>',
  dim:'<path d="M3 14h18M6 11l-3 3 3 3M18 11l3 3-3 3M3 9v10M21 9v10"/><path d="M10 8h4" stroke-width="1.6"/>',
  hole:'<circle cx="12" cy="12" r="6"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5" stroke-width="1.4"/>', arrow:'<path d="M5 19L19 5M10 5h9v9"/>',
  rect:'<rect x="3.5" y="6" width="17" height="12" rx="1"/>', circle:'<circle cx="12" cy="12" r="8.5"/>',
  triangle:'<path d="M12 4l9 16H3z"/>', diamond:'<path d="M12 3l9 9-9 9-9-9z"/>',
  cube:'<path d="M4 9h11v11H4zM4 9l5-5h11v11l-5 5M15 9l5-5"/>',
  sphere:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12c0 1.9 3.8 3.3 8.5 3.3s8.5-1.4 8.5-3.3"/><path d="M20.5 12c0-1.9-3.8-3.3-8.5-3.3S3.5 10.1 3.5 12" stroke-dasharray="2 2.2"/>',
  text:'<path d="M5 7V5h14v2M12 5v14M9 19h6"/>',
  move:'<path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/>',
  fileNew:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>',
  folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  share:'<path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 002 2h10a2 2 0 002-2v-6"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h8"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  file:'<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/>'
};
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
document.querySelectorAll('[data-icon]').forEach(el => el.insertAdjacentHTML('afterbegin', svg(I[el.dataset.icon])));

const SHAPES = [
  {id:'line',label:'Ligne'},{id:'dim',label:'Cote'},{id:'arrow',label:'Flèche'},{id:'rect',label:'Rectangle',short:'Rect.'},{id:'circle',label:'Cercle'},
  {id:'hole',label:'Trou'},
  {id:'triangle',label:'Triangle'},{id:'diamond',label:'Losange'},{id:'cube',label:'Cube'},{id:'sphere',label:'Sphère'}
];
const COLORS = [
  ['#1c2230','Noir'],['#667085','Gris'],['#d92d20','Rouge'],['#f97316','Orange'],['#eab308','Jaune'],
  ['#16a34a','Vert'],['#2563eb','Bleu'],['#7c3aed','Violet'],['#92400e','Brun'],['#ffffff','Blanc (efface)']
];
const WIDTHS = [[2,'Fin'],[4,'Moyen'],[8,'Épais']];
const GRID = 20, STORE = 'plans.v1', CUR = 'plans.current';

/* ---------- État ---------- */
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const DEMO = qs.has('demo'), ETAT = qs.get('etat');
const cv = $('board'), ctx = cv.getContext('2d'), mctx = document.createElement('canvas').getContext('2d');
let W = 0, H = 0, DPR = 1;
const view = {x:0, y:0, s:1};
let objs = [], hist = [], fut = [], draft = null, action = null, gesture = null, textAt = null;
const S = {tool:'pen', shape:'line', color:COLORS[0][0], width:4, grid:false, sel:null};
let doc = null, lastSaved = null, saveTimer = null, shapeTipShown = false;
const pointers = new Map();

/* ---------- Stockage (localStorage, protégé) ---------- */
const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
const ser = list => JSON.stringify(list, (k,v) => k === '_img' ? undefined : v);
const deser = s => JSON.parse(s).map(hydrate);
function hydrate(o){
  if (o.t === 'image' && !o._img){ const im = new Image(); im.onload = render; im.src = o.src; o._img = im; }
  return o;
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const defaultName = () => 'Plan du ' + new Date().toLocaleDateString('fr-CA',{day:'numeric',month:'short'});
const fmtDate = ts => new Date(ts).toLocaleString('fr-CA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const fmtTime = ts => new Date(ts).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function allDocs(){ return LS.get(STORE) || {}; }
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
function saveNow(){
  clearTimeout(saveTimer);
  if (DEMO || !doc) return true;
  const all = allDocs();
  all[doc.id] = {id:doc.id, name:doc.name, created:doc.created, updated:Date.now(), objs:JSON.parse(ser(objs)), thumb:thumbOf(objs)};
  const ok = LS.set(STORE, all) && LS.set(CUR, doc.id);
  if (ok) lastSaved = Date.now(); else toast('Espace de stockage plein — exportez puis supprimez d’anciens dessins.');
  updateStatus(ok);
  return ok;
}
function updateStatus(ok = true){
  const el = $('saveStatus');
  el.classList.toggle('warn', DEMO || !ok);
  el.textContent = DEMO ? 'Mode démo — rien n’est enregistré'
    : !ok ? 'Non enregistré — stockage plein'
    : lastSaved ? 'Enregistré sur cet appareil à ' + fmtTime(lastSaved) : 'Enregistré automatiquement sur cet appareil';
  $('docName').textContent = doc ? doc.name : '';
}
function openDoc(d){
  doc = {id:d.id, name:d.name, created:d.created || Date.now()};
  objs = (d.objs || []).map(o => hydrate({...o}));
  hist = []; fut = []; S.sel = null; lastSaved = d.updated || null;
  fitView(); updateUI(); updateStatus();
}
function newDoc(){ openDoc({id:uid(), name:defaultName(), objs:[]}); }

/* ---------- Géométrie ---------- */
const toWorld = (x,y) => ({x:(x - view.x) / view.s, y:(y - view.y) / view.s});
const font = size => `600 ${size}px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif`;
function bbox(o){
  let l,t,r,b;
  if (o.pts){ l = r = o.pts[0][0]; t = b = o.pts[0][1];
    for (const [x,y] of o.pts){ if(x<l)l=x; if(x>r)r=x; if(y<t)t=y; if(y>b)b=y; } }
  else if (o.t === 'text'){ mctx.font = font(o.size); const ls = o.text.split('\n');
    l = o.x1; t = o.y1; r = l + Math.max(...ls.map(s => mctx.measureText(s).width)); b = t + ls.length * o.size * 1.25; }
  else { l = Math.min(o.x1,o.x2); r = Math.max(o.x1,o.x2); t = Math.min(o.y1,o.y2); b = Math.max(o.y1,o.y2); }
  const m = (o.w || 0) / 2 + (o.t === 'arrow' ? 6 : o.t === 'dim' ? 26 : o.t === 'hole' ? (r - l) * .3 : 0);
  return {l:l-m, t:t-m, r:r+m, b:b+m};
}
function union(list){
  const u = {l:Infinity,t:Infinity,r:-Infinity,b:-Infinity};
  for (const o of list){ const b = bbox(o); u.l=Math.min(u.l,b.l); u.t=Math.min(u.t,b.t); u.r=Math.max(u.r,b.r); u.b=Math.max(u.b,b.b); }
  return u;
}
function distSeg(p,x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1, L = dx*dx + dy*dy;
  let k = L ? ((p.x-x1)*dx + (p.y-y1)*dy) / L : 0; k = Math.max(0, Math.min(1, k));
  return Math.hypot(p.x - (x1 + k*dx), p.y - (y1 + k*dy));
}
function hitTest(p){
  const tol = 14 / view.s;
  for (let i = objs.length - 1; i >= 0; i--){
    const o = objs[i], w = (o.w || 0) / 2 + tol;
    if (o.pts){
      if (o.pts.length === 1 && Math.hypot(p.x-o.pts[0][0], p.y-o.pts[0][1]) < w) return o;
      for (let j = 1; j < o.pts.length; j++) if (distSeg(p, ...o.pts[j-1], ...o.pts[j]) < w) return o;
    } else if (o.t === 'line' || o.t === 'arrow' || o.t === 'dim'){
      if (distSeg(p, o.x1, o.y1, o.x2, o.y2) < w) return o;
    } else { const b = bbox(o); if (p.x > b.l-tol && p.x < b.r+tol && p.y > b.t-tol && p.y < b.b+tol) return o; }
  }
  return null;
}
function translate(o,dx,dy){
  if (o.pts) o.pts.forEach(pt => { pt[0] += dx; pt[1] += dy; });
  o.x1 += dx; o.y1 += dy; if (o.x2 != null){ o.x2 += dx; o.y2 += dy; }
}
const snap = p => S.grid ? {x:Math.round(p.x/GRID)*GRID, y:Math.round(p.y/GRID)*GRID} : p;

/* ---------- Rendu ---------- */
function drawObj(c,o){
  c.save();
  c.strokeStyle = c.fillStyle = o.c; c.lineWidth = o.w; c.lineCap = 'round'; c.lineJoin = 'round';
  const l = Math.min(o.x1,o.x2), t = Math.min(o.y1,o.y2), w = Math.abs(o.x2-o.x1), h = Math.abs(o.y2-o.y1);
  const P = pts => { c.beginPath(); c.moveTo(...pts[0]); pts.slice(1).forEach(q => c.lineTo(...q)); };
  switch (o.t){
    case 'pen': {
      const p = o.pts; c.beginPath(); c.moveTo(p[0][0], p[0][1]);
      if (p.length === 1) c.lineTo(p[0][0] + .01, p[0][1]);
      else { for (let i = 1; i < p.length - 1; i++) c.quadraticCurveTo(p[i][0], p[i][1], (p[i][0]+p[i+1][0])/2, (p[i][1]+p[i+1][1])/2);
             c.lineTo(...p[p.length-1]); }
      c.stroke(); break; }
    case 'line': P([[o.x1,o.y1],[o.x2,o.y2]]); c.stroke(); break;
    case 'arrow': {
      P([[o.x1,o.y1],[o.x2,o.y2]]); c.stroke();
      const a = Math.atan2(o.y2-o.y1, o.x2-o.x1), len = 10 + o.w * 2.5, sp = .45;
      P([[o.x2 - len*Math.cos(a-sp), o.y2 - len*Math.sin(a-sp)], [o.x2,o.y2], [o.x2 - len*Math.cos(a+sp), o.y2 - len*Math.sin(a+sp)]]); c.stroke(); break; }
    case 'dim': {                                             // cote : flèches aux deux bouts + valeur
      const a = Math.atan2(o.y2-o.y1, o.x2-o.x1), nx = -Math.sin(a), ny = Math.cos(a), len = 9 + o.w * 2, sp = .42, e = 10;
      P([[o.x1,o.y1],[o.x2,o.y2]]); c.stroke();
      for (const [x,y,d] of [[o.x1,o.y1,1],[o.x2,o.y2,-1]]){
        const b = a + (d < 0 ? Math.PI : 0);
        P([[x + len*Math.cos(b-sp), y + len*Math.sin(b-sp)], [x,y], [x + len*Math.cos(b+sp), y + len*Math.sin(b+sp)]]); c.stroke();
        P([[x - nx*e, y - ny*e], [x + nx*e, y + ny*e]]); c.stroke();
      }
      if (o.label){
        const L = Math.hypot(o.x2-o.x1, o.y2-o.y1), fs = o.size || 16;
        let ang = a; if (ang > Math.PI/2 || ang < -Math.PI/2) ang += Math.PI;   // texte jamais à l'envers
        c.translate((o.x1+o.x2)/2, (o.y1+o.y2)/2); c.rotate(ang);
        c.font = font(fs); c.textAlign = 'center'; c.textBaseline = 'bottom';
        const tw = c.measureText(o.label).width;
        c.fillStyle = '#fff'; c.fillRect(-tw/2 - 4, -fs - 6, tw + 8, fs + 2);
        c.fillStyle = o.c; c.fillText(o.label, 0, -5);
      }
      break; }
    case 'hole': {                                            // trou : cercle + axes
      const cx = l+w/2, cy = t+h/2, ext = w * .3;
      c.beginPath(); c.ellipse(cx, cy, w/2, h/2, 0, 0, Math.PI*2); c.stroke();
      c.lineWidth = Math.max(1, o.w * .45); c.setLineDash([o.w*3, o.w*1.2, o.w*.6, o.w*1.2]);
      P([[cx, t-ext],[cx, t+h+ext]]); c.stroke(); P([[l-ext, cy],[l+w+ext, cy]]); c.stroke(); break; }
    case 'rect': c.strokeRect(l,t,w,h); break;
    case 'circle': c.beginPath(); c.ellipse(l+w/2, t+h/2, w/2, h/2, 0, 0, Math.PI*2); c.stroke(); break;
    case 'triangle': P([[l+w/2,t],[l+w,t+h],[l,t+h]]); c.closePath(); c.stroke(); break;
    case 'diamond': P([[l+w/2,t],[l+w,t+h/2],[l+w/2,t+h],[l,t+h/2]]); c.closePath(); c.stroke(); break;
    case 'cube': {
      const d = Math.min(w,h) * .32, fr = [l, t+d, w-d, h-d];
      c.strokeRect(...fr);
      P([[l,t+d],[l+d,t],[l+w,t],[l+w,t+h-d],[l+w-d,t+h]]); c.stroke();
      P([[l+w-d,t+d],[l+w,t]]); c.stroke();
      c.setLineDash([o.w*2, o.w*2.2]); c.globalAlpha = .55;
      P([[l+d,t],[l+d,t+h-d],[l+w,t+h-d]]); c.stroke(); P([[l+d,t+h-d],[l,t+h]]); c.stroke();
      break; }
    case 'sphere': {
      const cx = l+w/2, cy = t+h/2;
      c.beginPath(); c.ellipse(cx, cy, w/2, h/2, 0, 0, Math.PI*2); c.stroke();
      c.beginPath(); c.ellipse(cx, cy, w/2, h*.14, 0, 0, Math.PI); c.stroke();
      c.setLineDash([o.w*2, o.w*2.2]); c.globalAlpha = .55;
      c.beginPath(); c.ellipse(cx, cy, w/2, h*.14, 0, Math.PI, Math.PI*2); c.stroke(); break; }
    case 'text':
      c.font = font(o.size); c.textBaseline = 'top';
      o.text.split('\n').forEach((s,i) => c.fillText(s, o.x1, o.y1 + i * o.size * 1.25 + o.size * .1)); break;
    case 'image':
      if (o._img && o._img.complete && o._img.naturalWidth) c.drawImage(o._img, l, t, w, h);
      else { c.strokeStyle = '#d0d5dd'; c.lineWidth = 1; c.strokeRect(l,t,w,h); } break;
  }
  c.restore();
}
function drawGrid(){
  const step = GRID * view.s; if (step < 5) return;
  const i0 = Math.floor(-view.x/step), i1 = Math.ceil((W-view.x)/step), j0 = Math.floor(-view.y/step), j1 = Math.ceil((H-view.y)/step);
  ctx.lineWidth = 1;
  for (const major of [false, true]){
    ctx.strokeStyle = major ? '#c9d3e0' : '#e8edf3'; ctx.beginPath();
    for (let i = i0; i <= i1; i++) if ((i % 5 === 0) === major){ const x = Math.round(view.x + i*step) + .5; ctx.moveTo(x,0); ctx.lineTo(x,H); }
    for (let j = j0; j <= j1; j++) if ((j % 5 === 0) === major){ const y = Math.round(view.y + j*step) + .5; ctx.moveTo(0,y); ctx.lineTo(W,y); }
    ctx.stroke();
  }
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
  if (S.grid) drawGrid();
  ctx.setTransform(DPR*view.s, 0, 0, DPR*view.s, DPR*view.x, DPR*view.y);
  objs.forEach(o => drawObj(ctx,o));
  if (draft) drawObj(ctx, draft);
  const bar = $('selBar');
  if (S.sel && objs.includes(S.sel)){
    const b = bbox(S.sel), m = 6 / view.s;
    ctx.save(); ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 1.5 / view.s; ctx.setLineDash([6/view.s, 4/view.s]);
    ctx.strokeRect(b.l-m, b.t-m, b.r-b.l+2*m, b.b-b.t+2*m); ctx.restore();
    const sx = (b.l+b.r)/2*view.s + view.x; let sy = (b.t-m)*view.s + view.y - 56;
    if (sy < 76) sy = (b.b+m)*view.s + view.y + 12;
    bar.style.left = Math.max(130, Math.min(W-130, sx)) + 'px'; bar.style.top = Math.min(H-170, Math.max(76, sy)) + 'px';
    bar.hidden = !!action;
  } else { S.sel = null; bar.hidden = true; }
  $('hint').hidden = objs.length > 0 || !!draft;
}
function renderTo(list, w, h, pad){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0,0,w,h);
  if (!list.length) return c;
  const b = union(list), s = Math.min((w-2*pad)/Math.max(b.r-b.l,1), (h-2*pad)/Math.max(b.b-b.t,1));
  x.setTransform(s, 0, 0, s, w/2 - (b.l+b.r)/2*s, h/2 - (b.t+b.b)/2*s);
  list.forEach(o => drawObj(x,o));
  return c;
}
const thumbOf = list => renderTo(list, 320, 240, 18).toDataURL('image/jpeg', .72);
function fitView(){
  if (!objs.length){ view.s = 1; view.x = W/2; view.y = H/2; return; }
  const b = union(objs), top = 80, bottom = 112, aw = W - 40, ah = H - top - bottom;
  view.s = Math.max(.25, Math.min(aw/(b.r-b.l), ah/(b.b-b.t), 1.6));
  view.x = W/2 - (b.l+b.r)/2*view.s; view.y = top + ah/2 - (b.t+b.b)/2*view.s;
}
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 3); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR); render();
}

/* ---------- Historique ---------- */
function snapshot(){ hist.push(ser(objs)); if (hist.length > 100) hist.shift(); fut = []; }
function changed(){ updateUI(); render(); scheduleSave(); }
function undo(){ if (!hist.length) return; fut.push(ser(objs)); objs = deser(hist.pop()); S.sel = null; changed(); }
function redo(){ if (!fut.length) return; hist.push(ser(objs)); objs = deser(fut.pop()); S.sel = null; changed(); }

/* ---------- Pointeurs sur la zone de dessin ---------- */
function anyOverlayOpen(){ return !$('menu').hidden || !$('popShapes').hidden || !$('popColors').hidden; }
cv.addEventListener('pointerdown', e => {
  if (anyOverlayOpen()){ closeOverlays(); return; }
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 2){                           // deux doigts : zoom / déplacement de la vue
    draft = null; action = null;
    const [a,b] = [...pointers.values()];
    gesture = {d:Math.hypot(a.x-b.x, a.y-b.y), m:{x:(a.x+b.x)/2, y:(a.y+b.y)/2}, v:{...view}};
    render(); return;
  }
  if (pointers.size > 2) return;
  const p = toWorld(e.clientX, e.clientY);
  const base = {c:S.color, w:S.width};
  if (S.tool === 'pen'){ draft = {t:'pen', ...base, pts:[[p.x,p.y]]}; action = 'draw'; }
  else if (S.tool === 'shape'){ const s = snap(p); draft = {t:S.shape, ...base, x1:s.x, y1:s.y, x2:s.x, y2:s.y}; action = 'draw'; }
  else if (S.tool === 'text'){ textAt = p; action = 'text'; }
  else if (S.tool === 'move'){
    const hit = hitTest(p);
    if (hit){ S.sel = hit; action = {k:'drag', last:p, moved:false}; }
    else { S.sel = null; action = {k:'pan', sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y}; }
  }
  render();
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (gesture && pointers.size >= 2){
    const [a,b] = [...pointers.values()], d = Math.hypot(a.x-b.x, a.y-b.y), m = {x:(a.x+b.x)/2, y:(a.y+b.y)/2}, g = gesture;
    view.s = Math.max(.2, Math.min(8, g.v.s * d / g.d));
    const wx = (g.m.x - g.v.x) / g.v.s, wy = (g.m.y - g.v.y) / g.v.s;
    view.x = m.x - wx*view.s; view.y = m.y - wy*view.s;
    showZoom(); render(); return;
  }
  if (!action) return;
  const p = toWorld(e.clientX, e.clientY);
  if (action === 'draw' && draft.t === 'pen'){
    const q = draft.pts[draft.pts.length-1];
    if (Math.hypot(p.x-q[0], p.y-q[1]) * view.s > 1.5) draft.pts.push([p.x,p.y]);
  } else if (action === 'draw'){
    let s = snap(p);
    if (draft.t === 'circle' || draft.t === 'sphere' || draft.t === 'hole'){   // garder rond
      const dx = s.x-draft.x1, dy = s.y-draft.y1, n = Math.max(Math.abs(dx), Math.abs(dy));
      s = {x:draft.x1 + Math.sign(dx||1)*n, y:draft.y1 + Math.sign(dy||1)*n};
    } else if ((draft.t === 'line' || draft.t === 'arrow' || draft.t === 'dim') && !S.grid){   // redresse à 0/45/90°
      const dx = s.x-draft.x1, dy = s.y-draft.y1, a = Math.atan2(dy,dx), st = Math.PI/4, sa = Math.round(a/st)*st, L = Math.hypot(dx,dy);
      if (Math.abs(a-sa) < .09) s = {x:draft.x1 + Math.cos(sa)*L, y:draft.y1 + Math.sin(sa)*L};
    }
    draft.x2 = s.x; draft.y2 = s.y;
  } else if (action.k === 'drag'){
    if (!action.moved){ snapshot(); action.moved = true; }
    translate(S.sel, p.x-action.last.x, p.y-action.last.y); action.last = p;
  } else if (action.k === 'pan'){
    view.x = action.vx + e.clientX - action.sx; view.y = action.vy + e.clientY - action.sy;
  }
  render();
});
function endPointer(e){
  if (!pointers.delete(e.pointerId)) return;
  if (gesture){ if (pointers.size < 2) gesture = null; if (!pointers.size) render(); return; }
  if (action === 'draw' && draft){
    const big = draft.pts ? true : Math.max(Math.abs(draft.x2-draft.x1), Math.abs(draft.y2-draft.y1)) * view.s > 4;
    if (big){ const o = draft; snapshot(); objs.push(o); draft = null; changed(); if (o.t === 'dim') askDim(o, true); }
    draft = null;
  } else if (action === 'text' && e.type === 'pointerup'){
    const hit = hitTest(textAt), p = textAt;
    action = null;
    if (hit && hit.t === 'text') editText(hit); else if (hit && hit.t === 'dim') askDim(hit); else addText(p);
  } else if (action && action.moved){ changed(); }
  action = null; render();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => {                       // test sur ordinateur : molette = zoom
  e.preventDefault();
  const f = Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)), s = Math.max(.2, Math.min(8, view.s * f));
  const w = toWorld(e.clientX, e.clientY); view.s = s; view.x = e.clientX - w.x*s; view.y = e.clientY - w.y*s;
  showZoom(); render();
}, {passive:false});
let zoomTimer;
function showZoom(){
  const z = $('zoomPill'); z.textContent = Math.round(view.s*100) + ' %'; z.hidden = false;
  clearTimeout(zoomTimer); zoomTimer = setTimeout(() => z.hidden = true, 2500);
}
$('zoomPill').addEventListener('click', () => { fitView(); render(); $('zoomPill').hidden = true; });

/* ---------- Texte ---------- */
const textSize = () => ({2:16, 4:22, 8:32})[S.width] || 22;
async function addText(p){
  const v = await ask('Ajouter du texte', '', 'Ajouter');
  if (!v) return;
  snapshot(); objs.push({t:'text', c:S.color, w:0, size:textSize(), text:v, x1:p.x, y1:p.y - textSize()/2}); changed();
}
async function editText(o){
  const v = await ask('Modifier le texte', o.text, 'Enregistrer');
  if (v == null) return;
  snapshot(); if (v) o.text = v; else objs.splice(objs.indexOf(o), 1); changed();
}
async function askDim(o, fresh){
  const v = await ask('Valeur de la cote (ex. 120 mm)', o.label || '', fresh ? 'Ajouter' : 'Enregistrer');
  if (v == null) return;
  if (!fresh) snapshot();
  o.label = v; o.size = textSize() - 4; changed();
}
function ask(title, value, okLabel, focus = true){
  return new Promise(res => {
    const d = $('dlg'), inp = $('dlgInput'), f = $('dlgForm');
    $('dlgTitle').textContent = title; $('dlgOk').textContent = okLabel; inp.value = value;
    d.hidden = false; if (focus) inp.focus();
    const done = v => { d.hidden = true; f.onsubmit = null; $('dlgCancel').onclick = null; d.onpointerdown = null; inp.blur(); res(v); };
    f.onsubmit = ev => { ev.preventDefault(); done(inp.value.trim()); };
    inp.onkeydown = ev => { if (ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); f.requestSubmit(); } };
    $('dlgCancel').onclick = () => done(null);
    d.onpointerdown = ev => { if (ev.target === d) done(null); };
  });
}

/* ---------- Barre d'outils ---------- */
function setTool(t){ S.tool = t; if (t !== 'move') S.sel = null; updateUI(); render(); }
document.querySelectorAll('.tool[data-tool]').forEach(b => {
  if (b.id === 'toolShape') return;
  b.addEventListener('click', () => { closeOverlays(); setTool(b.dataset.tool); });
});
const shapeBtn = $('toolShape'); let lpTimer, lpFired = false;
shapeBtn.addEventListener('pointerdown', () => { lpFired = false; lpTimer = setTimeout(() => { lpFired = true; setTool('shape'); openPop('popShapes'); navigator.vibrate && navigator.vibrate(10); }, 450); });
['pointerup','pointerleave','pointercancel'].forEach(ev => shapeBtn.addEventListener(ev, () => clearTimeout(lpTimer)));
shapeBtn.addEventListener('contextmenu', e => e.preventDefault());
shapeBtn.addEventListener('click', () => {
  if (lpFired){ lpFired = false; return; }
  if (S.tool === 'shape') togglePop('popShapes');
  else { closeOverlays(); setTool('shape'); if (!shapeTipShown){ shapeTipShown = true; toast('Astuce : maintenez ce bouton enfoncé pour choisir une autre forme (cote, trou, rectangle…).'); } }
});
$('shapeGrid').innerHTML = SHAPES.map(s => `<button data-shape="${s.id}" aria-pressed="false">${svg(I[s.id])}${s.label}</button>`).join('');
$('shapeGrid').addEventListener('click', e => { const b = e.target.closest('[data-shape]'); if (!b) return; S.shape = b.dataset.shape; setTool('shape'); closeOverlays(); });
$('toolColor').addEventListener('click', () => togglePop('popColors'));
$('colorGrid').innerHTML = COLORS.map(([c,n]) => `<button data-color="${c}" aria-label="${n}" aria-pressed="false" style="background:${c}"></button>`).join('');
$('colorGrid').addEventListener('click', e => { const b = e.target.closest('[data-color]'); if (!b) return; S.color = b.dataset.color; recolorSel(); updateUI(); });
$('widthGrid').innerHTML = WIDTHS.map(([w,n]) => `<button data-width="${w}" aria-pressed="false"><i style="height:${Math.max(2,w)}px"></i>${n}</button>`).join('');
$('widthGrid').addEventListener('click', e => { const b = e.target.closest('[data-width]'); if (!b) return; S.width = +b.dataset.width; updateUI(); });
function recolorSel(){ if (S.tool === 'move' && S.sel){ snapshot(); S.sel.c = S.color; changed(); } }

$('btnGrid').addEventListener('click', () => { S.grid = !S.grid; updateUI(); render(); toast(S.grid ? 'Quadrillage activé — les formes s’alignent sur la grille' : 'Quadrillage désactivé'); });
$('btnUndo').addEventListener('click', undo);
$('btnRedo').addEventListener('click', redo);
$('btnDel').addEventListener('click', () => { if (!S.sel) return; snapshot(); objs.splice(objs.indexOf(S.sel), 1); S.sel = null; changed(); });
$('btnDup').addEventListener('click', () => {
  if (!S.sel) return; snapshot();
  const c = hydrate(JSON.parse(ser([S.sel]))[0]); translate(c, 20, 20); objs.push(c); S.sel = c; changed();
});
addEventListener('keydown', e => {
  if (!$('dlg').hidden) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) $('btnDel').click();
});

function updateUI(){
  document.querySelectorAll('.tool[data-tool]').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === S.tool));
  const sh = SHAPES.find(s => s.id === S.shape);
  $('shapeIco').innerHTML = svg(I[sh.id]); $('shapeLbl').textContent = sh.short || sh.label;
  document.querySelectorAll('[data-shape]').forEach(b => b.setAttribute('aria-pressed', b.dataset.shape === S.shape));
  document.querySelectorAll('[data-color]').forEach(b => b.setAttribute('aria-pressed', b.dataset.color === S.color));
  document.querySelectorAll('[data-width]').forEach(b => { b.setAttribute('aria-pressed', +b.dataset.width === S.width); b.querySelector('i').style.background = S.color === '#ffffff' ? '#98a2b3' : S.color; });
  $('colorIco').style.background = S.color;
  $('btnGrid').setAttribute('aria-pressed', S.grid);
  $('btnUndo').disabled = !hist.length; $('btnRedo').disabled = !fut.length;
}

/* ---------- Menu, popovers, feuilles ---------- */
function openPop(id){ closeOverlays(); $(id).hidden = false; }
function togglePop(id){ const was = !$(id).hidden; closeOverlays(); if (!was) $(id).hidden = false; }
function closeOverlays(){
  ['popShapes','popColors','menu'].forEach(id => $(id).hidden = true);
  $('btnMenu').hidden = false; $('btnMenu').setAttribute('aria-expanded', 'false');
}
function openMenu(){ closeOverlays(); updateStatus(); $('menu').hidden = false; $('btnMenu').hidden = true; $('btnMenu').setAttribute('aria-expanded','true'); }
$('btnMenu').addEventListener('click', openMenu);
$('btnMenuClose').addEventListener('click', closeOverlays);
$('btnRename').addEventListener('click', async () => {
  const v = await ask('Nom du dessin', doc.name, 'Renommer');
  if (v){ doc.name = v.replace(/\s+/g,' '); saveNow(); updateStatus(); }
});
$('menu').addEventListener('click', e => {
  const act = e.target.closest('[data-act]'); if (!act) return;
  closeOverlays();
  ({new:actNew, list:openList, import:() => $('fileIn').click(), export:() => openSheet('sheetExport')})[act.dataset.act]();
});
function openSheet(id){ closeOverlays(); $('scrim').hidden = false; $(id).hidden = false; }
function closeSheets(){ $('scrim').hidden = true; ['sheetList','sheetExport'].forEach(id => $(id).hidden = true); }
$('scrim').addEventListener('click', closeSheets);
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeSheets));

function actNew(){
  const had = objs.length; saveNow();
  if (DEMO){ objs = []; hist = []; fut = []; doc = {id:uid(), name:defaultName()}; fitView(); updateUI(); render(); }
  else { newDoc(); render(); }
  if (had) toast('Nouveau dessin — le précédent est gardé dans « Mes dessins ».');
}

/* Mes dessins */
let demoDocs = [];
function listDocs(){ return DEMO ? demoDocs : Object.values(allDocs()).sort((a,b) => b.updated - a.updated); }
function openList(){
  saveNow();
  const list = listDocs();
  $('cards').innerHTML = list.length ? list.map(d => `
    <div class="card${doc && d.id === doc.id ? ' current' : ''}">
      <button class="card-open" data-open="${d.id}"><img src="${d.thumb}" alt=""><span class="card-name">${esc(d.name)}</span>
        <span class="card-date">${doc && d.id === doc.id ? 'Ouvert maintenant' : fmtDate(d.updated)}</span></button>
      <button class="card-del" data-del="${d.id}" aria-label="Supprimer ${esc(d.name)}">${svg(I.trash)}</button>
    </div>`).join('') : '<p class="empty">Aucun dessin enregistré pour l’instant.</p>';
  openSheet('sheetList');
}
$('cards').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'), d = e.target.closest('[data-del]');
  if (o){ const found = listDocs().find(x => x.id === o.dataset.open); if (found){ saveNow(); openDoc(found); render(); closeSheets(); } }
  if (d){
    const found = listDocs().find(x => x.id === d.dataset.del);
    if (!found || !confirm(`Supprimer « ${found.name} » ? Cette action est définitive.`)) return;
    if (DEMO) demoDocs = demoDocs.filter(x => x.id !== found.id);
    else { const all = allDocs(); delete all[found.id]; LS.set(STORE, all); }
    if (doc && found.id === doc.id){ DEMO ? actNew() : newDoc(); render(); }
    openList();
  }
});

/* Exporter */
function download(blob, name){
  const file = new File([blob], name, {type:blob.type});
  if (navigator.canShare && navigator.canShare({files:[file]}))
    return navigator.share({files:[file], title:doc.name}).catch(() => {});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const safeName = () => (doc.name || 'plan').replace(/[\\/:*?"<>|]+/g, '-');
$('expPng').addEventListener('click', () => {
  if (!objs.length){ toast('Le dessin est vide.'); return; }
  const b = union(objs), bw = b.r-b.l, bh = b.b-b.t, s = Math.min(2, 4000/bw, 4000/bh);
  renderTo(objs, Math.round(bw*s + 80), Math.round(bh*s + 80), 40).toBlob(bl => download(bl, safeName() + '.png'), 'image/png');
  closeSheets();
});
$('expPlan').addEventListener('click', () => {
  download(new Blob([JSON.stringify({app:'plans', version:1, name:doc.name, objs:JSON.parse(ser(objs))})], {type:'application/json'}), safeName() + '.plan.json');
  closeSheets();
});

/* Importer */
$('fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (/json$/i.test(f.name) || f.type.includes('json')){
    try {
      const data = JSON.parse(await f.text());
      if (!Array.isArray(data.objs)) throw 0;
      saveNow(); openDoc({id:uid(), name:data.name || f.name.replace(/\.plan\.json$|\.json$/i,''), objs:data.objs}); render(); saveNow();
      toast('Dessin importé.');
    } catch(err){ toast('Ce fichier n’est pas un dessin valide.'); }
    return;
  }
  const url = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
  const im = new Image(); im.onload = () => {
    const max = 1600, k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
    c.width = Math.round(im.width*k); c.height = Math.round(im.height*k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    const src = c.toDataURL('image/jpeg', .82), tl = toWorld(20, 90), vw = (W-40)/view.s, vh = (H-210)/view.s;
    const sc = Math.min(vw/c.width, vh/c.height), w = c.width*sc, h = c.height*sc;
    const o = hydrate({t:'image', src, w:0, c:'#000', x1:tl.x + (vw-w)/2, y1:tl.y + (vh-h)/2, x2:tl.x + (vw+w)/2, y2:tl.y + (vh+h)/2});
    snapshot(); objs.unshift(o); changed();
    toast('Image importée en arrière-plan — dessinez par-dessus, ou « Déplacer » pour la bouger.');
  };
  im.src = url;
});

let toastTimer;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200); }

/* ---------- Données de démonstration ---------- */
const K = '#1c2230', RED = '#d92d20', BLUE = '#2563eb';
const T = (text,x,y,c=K,size=16) => ({t:'text',c,w:0,size,text,x1:x,y1:y});
const D = (x1,y1,x2,y2,label) => ({t:'dim',c:RED,w:2,size:15,x1,y1,x2,y2,label});
const HOLE = (cx,cy,r,c=K) => ({t:'hole',c,w:2,x1:cx-r,y1:cy-r,x2:cx+r,y2:cy+r});
function demoPlate(){                                    // plaque de fixation, vue de face
  return [
    {t:'rect',c:K,w:4,x1:-150,y1:-90,x2:150,y2:90},
    HOLE(-115,-55,11),HOLE(115,-55,11),HOLE(-115,55,11),HOLE(115,55,11),
    {t:'rect',c:K,w:3,x1:-45,y1:-18,x2:45,y2:18},
    D(-150,-125,150,-125,'300 mm'), D(185,-90,185,90,'180 mm'),
    D(-115,125,115,125,'230 mm'),
    {t:'arrow',c:BLUE,w:2,x1:-20,y1:-60,x2:-80,y2:-58},
    T('4 × Ø 12',-12,-72,BLUE,15),
    T('Oblong 90 × 36',-52,26,BLUE,13),
    T('Acier 1/4 po — Qté : 4',-150,160,K,17)
  ];
}
function demoSet(){
  const now = Date.now();
  const bolt = []; for (let i = 0; i < 6; i++){ const a = i*Math.PI/3; bolt.push(HOLE(Math.cos(a)*95, Math.sin(a)*95, 10)); }
  return [
    {id:'d1', name:'Plaque de fixation', updated:now - 6e5, objs:demoPlate()},
    {id:'d2', name:'Bride Ø 250', updated:now - 864e5, objs:[
      {t:'circle',c:K,w:4,x1:-125,y1:-125,x2:125,y2:125}, HOLE(0,0,45), ...bolt,
      D(-125,-160,125,-160,'Ø 250'), T('6 trous Ø 20 sur Ø 190',-90,150,BLUE,15)]},
    {id:'d3', name:'Équerre de support', updated:now - 3*864e5, objs:[
      {t:'pen',c:K,w:4,pts:[[-100,-120],[-100,100],[120,100],[120,70],[-70,70],[-70,-120],[-100,-120]]},
      HOLE(-85,-80,7),HOLE(-85,-20,7),HOLE(60,85,7),
      D(-100,135,120,135,'220 mm'), D(-140,-120,-140,100,'220 mm'), T('Cornière 3 × 3 × 1/4',-40,-60,BLUE,15)]},
    {id:'d4', name:'Boîtier moteur (3D)', updated:now - 9*864e5, objs:[
      {t:'cube',c:K,w:3,x1:-120,y1:-80,x2:120,y2:80},{t:'hole',c:K,w:2,x1:-85,y1:-10,x2:-35,y2:40},
      T('Tôle 16 ga — pliée',-80,105,BLUE,15)]}
  ].map(d => ({...d, thumb:thumbOf(d.objs)}));
}

/* ---------- Démarrage ---------- */
addEventListener('resize', resize);
W = innerWidth; H = innerHeight;
if (DEMO){
  demoDocs = demoSet();
  if (qs.get('demo') === 'vide'){ doc = {id:uid(), name:defaultName()}; objs = []; }
  else { doc = {id:'d1', name:demoDocs[0].name}; objs = demoPlate(); }
  fitView(); updateStatus();
} else {
  const all = allDocs(), cur = all[LS.get(CUR)];
  cur ? openDoc(cur) : newDoc();
}
updateUI(); resize();
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

// États pré-ouverts pour la galerie (index.html)
switch (ETAT){
  case 'menu': openMenu(); break;
  case 'formes': S.shape = 'dim'; setTool('shape'); openPop('popShapes'); break;
  case 'couleur': S.color = '#d92d20'; updateUI(); openPop('popColors'); break;
  case 'grille': S.grid = true; S.shape = 'rect'; setTool('shape'); break;
  case 'selection': setTool('move'); S.sel = objs.find(o => o.t === 'hole'); render(); break;
  case 'texte': setTool('text'); ask('Ajouter du texte', 'Entrée', 'Ajouter', false); break;
  case 'dessins': openList(); break;
  case 'exporter': openSheet('sheetExport'); break;
}
})();
</script>
